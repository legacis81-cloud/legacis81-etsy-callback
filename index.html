
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Legacis81 Etsy Connection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 24px;
    }
    main {
      max-width: 480px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      background: #222;
      color: white;
      border: 0;
      border-radius: 8px;
    }
    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Legacis81 Etsy Connection</h2>
  <p id="status">Ready to prepare Etsy authorization.</p>

  <label for="clientId">Etsy API Keystring</label>
  <input id="clientId"
         type="text"
         autocomplete="off"
         placeholder="Enter Etsy Keystring">

  <button id="connect">Connect to Etsy</button>
</main>

<script>
const redirectUri =
  "https://legacis81-cloud.github.io/" +
  "legacis81-etsy-callback/";

const status = document.getElementById("status");
const clientId = document.getElementById("clientId");

function randomString() {
  const bytes = new Uint8Array(48);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b =>
    b.toString(16).padStart(2, "0")
  ).join("");
}

function base64url(bytes) {
  return btoa(
    String.fromCharCode(...new Uint8Array(bytes))
  ).replace(/\+/g, "-")
   .replace(/\//g, "_")
   .replace(/=+$/, "");
}

async function createChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return base64url(hash);
}

document.getElementById("connect").onclick =
  async function () {
    const key = clientId.value.trim();

    if (!key) {
      status.textContent = "Enter your Etsy Keystring.";
      return;
    }

    const verifier = randomString();
    const state = randomString();
    const challenge = await createChallenge(verifier);

    sessionStorage.setItem("etsy_verifier", verifier);
    sessionStorage.setItem("etsy_state", state);
    sessionStorage.setItem("etsy_client_id", key);

    const params = new URLSearchParams({
      response_type: "code",
      client_id: key,
      redirect_uri: redirectUri,
      scope: "shops_r listings_r",
      state: state,
      code_challenge: challenge,
      code_challenge_method: "S256"
    });

    window.location.href =
      "https://www.etsy.com/oauth/connect?" +
      params.toString();
  };

const callback = new URLSearchParams(
  window.location.search
);

const code = callback.get("code");
const returnedState = callback.get("state");
const error = callback.get("error");

if (code || error) {
  history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

  const expectedState =
    sessionStorage.getItem("etsy_state");

  if (error) {
    status.textContent = "Etsy authorization was declined.";
  } else if (
    expectedState &&
    returnedState === expectedState &&
    sessionStorage.getItem("etsy_verifier")
  ) {
    status.textContent =
      "Etsy authorization verified. " +
      "Token exchange is not implemented yet.";
  } else {
    status.textContent =
      "Security check failed. Authorization rejected.";
  }

  sessionStorage.removeItem("etsy_state");
  sessionStorage.removeItem("etsy_verifier");
  sessionStorage.removeItem("etsy_client_id");
}
</script>
</body>
</html>
