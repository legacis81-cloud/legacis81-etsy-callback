
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Legacis81 Etsy Connection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
      padding: 20px;
    }
    main {
      background: white;
      max-width: 480px;
      margin: 35px auto;
      padding: 24px;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      font-size: 16px;
    }
    button {
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }
    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Legacis81 Etsy Connection</h2>

  <p id="status">
    Ready to prepare Etsy authorization.
  </p>

  <label for="clientId">Etsy API Keystring</label>
  <input
    id="clientId"
    type="text"
    autocomplete="off"
    spellcheck="false"
    placeholder="Enter Etsy Keystring"
  >

  <button id="connect">Connect to Etsy</button>
</main>

<script>
"use strict";

const redirectUri =
  "https://legacis81-cloud.github.io/" +
  "legacis81-etsy-callback/";

const statusElement =
  document.getElementById("status");

const clientIdInput =
  document.getElementById("clientId");

const connectButton =
  document.getElementById("connect");

function randomString() {
  const bytes = new Uint8Array(48);
  crypto.getRandomValues(bytes);

  return Array.from(bytes, byte =>
    byte.toString(16).padStart(2, "0")
  ).join("");
}

function base64url(buffer) {
  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function createChallenge(verifier) {
  const bytes = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest(
    "SHA-256",
    bytes
  );
  return base64url(digest);
}

async function prepareAuthorization() {
  const clientId = clientIdInput.value.trim();

  if (!clientId) {
    statusElement.textContent =
      "Please enter your Etsy Keystring.";
    return;
  }

  connectButton.disabled = true;

  try {
    const verifier = randomString();
    const state = randomString();

    const challenge =
      await createChallenge(verifier);

    sessionStorage.setItem(
      "legacis81_etsy_verifier",
      verifier
    );

    sessionStorage.setItem(
      "legacis81_etsy_state",
      state
    );

    sessionStorage.setItem(
      "legacis81_etsy_client_id",
      clientId
    );

    const params = new URLSearchParams({
      response_type: "code",
      client_id: clientId,
      redirect_uri: redirectUri,
      scope: "shops_r listings_r",
      state: state,
      code_challenge: challenge,
      code_challenge_method: "S256"
    });

    window.location.assign(
      "https://www.etsy.com/oauth/connect?" +
      params.toString()
    );

  } catch (error) {
    statusElement.textContent =
      "Unable to prepare authorization.";
    connectButton.disabled = false;
  }
}

connectButton.addEventListener(
  "click",
  prepareAuthorization
);

const params = new URLSearchParams(
  window.location.search
);

const code = params.get("code");
const returnedState = params.get("state");
const error = params.get("error");

if (code || error) {
  history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

  const expectedState = sessionStorage.getItem(
    "legacis81_etsy_state"
  );

  const verifier = sessionStorage.getItem(
    "legacis81_etsy_verifier"
  );

  if (error) {
    statusElement.textContent =
      "Etsy authorization was declined.";

    sessionStorage.removeItem(
      "legacis81_etsy_verifier"
    );
    sessionStorage.removeItem(
      "legacis81_etsy_state"
    );

  } else if (
    code &&
    expectedState &&
    returnedState === expectedState &&
    verifier
  ) {
    statusElement.textContent =
      "Authorization verified. " +
      "Token exchange is the next step.";

    // Keep the verifier temporarily.
    // Do not display or transmit OAuth secrets.

  } else {
    statusElement.textContent =
      "Security verification failed.";

    sessionStorage.removeItem(
      "legacis81_etsy_verifier"
    );
    sessionStorage.removeItem(
      "legacis81_etsy_state"
    );
  }
}
</script>
</body>
</html>
