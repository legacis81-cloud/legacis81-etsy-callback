
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Legacis81 Etsy Connection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      padding: 20px;
      color: #222;
    }
    main {
      max-width: 480px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
    }
    button:disabled {
      opacity: 0.5;
    }
    #status {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<main>
  <h2>Legacis81 Etsy Connection</h2>

  <p id="status">Ready to connect to Etsy.</p>

  <label for="clientId">Etsy API Keystring</label>
  <input
    id="clientId"
    type="text"
    autocomplete="off"
    spellcheck="false"
    placeholder="Enter Etsy Keystring"
  >

  <button id="connect">Connect to Etsy</button>
</main>

<script>
"use strict";

const redirectUri =
  "https://legacis81-cloud.github.io/" +
  "legacis81-etsy-callback/";

const tokenEndpoint =
  "https://api.etsy.com/v3/public/oauth/token";

const statusElement =
  document.getElementById("status");

const clientIdInput =
  document.getElementById("clientId");

const connectButton =
  document.getElementById("connect");

function randomString() {
  const bytes = new Uint8Array(48);
  crypto.getRandomValues(bytes);

  return Array.from(bytes, byte =>
    byte.toString(16).padStart(2, "0")
  ).join("");
}

function base64url(buffer) {
  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function createChallenge(verifier) {
  const bytes = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest(
    "SHA-256",
    bytes
  );
  return base64url(digest);
}

function clearTemporaryData() {
  sessionStorage.removeItem("etsy_verifier");
  sessionStorage.removeItem("etsy_state");
  sessionStorage.removeItem("etsy_client_id");
}

async function beginAuthorization() {
  const clientId = clientIdInput.value.trim();

  if (!clientId) {
    statusElement.textContent =
      "Please enter your Etsy Keystring.";
    return;
  }

  connectButton.disabled = true;

  try {
    const verifier = randomString();
    const state = randomString();
    const challenge =
      await createChallenge(verifier);

    sessionStorage.setItem(
      "etsy_verifier", verifier
    );
    sessionStorage.setItem(
      "etsy_state", state
    );
    sessionStorage.setItem(
      "etsy_client_id", clientId
    );

    const params = new URLSearchParams({
      response_type: "code",
      client_id: clientId,
      redirect_uri: redirectUri,
      scope: "shops_r listings_r",
      state: state,
      code_challenge: challenge,
      code_challenge_method: "S256"
    });

    window.location.assign(
      "https://www.etsy.com/oauth/connect?" +
      params.toString()
    );
  } catch (error) {
    statusElement.textContent =
      "Unable to prepare authorization.";
    connectButton.disabled = false;
  }
}

async function handleCallback() {
  const params = new URLSearchParams(
    window.location.search
  );

  const code = params.get("code");
  const returnedState = params.get("state");
  const error = params.get("error");

  if (!code && !error) return;

  history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

  connectButton.disabled = true;
  clientIdInput.style.display = "none";

  const expectedState =
    sessionStorage.getItem("etsy_state");

  const verifier =
    sessionStorage.getItem("etsy_verifier");

  const clientId =
    sessionStorage.getItem("etsy_client_id");

  if (error) {
    statusElement.textContent =
      "Etsy authorization was cancelled or denied.";
    clearTemporaryData();
    return;
  }

  if (
    !expectedState ||
    returnedState !== expectedState ||
    !verifier ||
    !clientId
  ) {
    statusElement.textContent =
      "Security verification failed. " +
      "Start the connection again.";
    clearTemporaryData();
    return;
  }

  // Prevent reusing the state.
  sessionStorage.removeItem("etsy_state");

  statusElement.textContent =
    "Authorization verified. " +
    "Requesting Etsy token...";

  try {
    const body = new URLSearchParams({
      grant_type: "authorization_code",
      client_id: clientId,
      redirect_uri: redirectUri,
      code: code,
      code_verifier: verifier
    });

    const response = await fetch(
      tokenEndpoint,
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body: body.toString(),
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "Token request failed."
      );
    }

    const data = await response.json();

    if (
      !data.access_token ||
      !data.refresh_token
    ) {
      throw new Error(
        "Missing token information."
      );
    }

    // Do not print or display the tokens.
    // This page does not persist tokens.
    statusElement.textContent =
      "Etsy authorization succeeded. " +
      "Tokens received temporarily, " +
      "but not saved. " +
      "A private storage step is still required.";

  } catch (error) {
    statusElement.textContent =
      "Token exchange could not be completed. " +
      "A secure server-side exchange may be required.";
  } finally {
    clearTemporaryData();
  }
}

connectButton.addEventListener(
  "click",
  beginAuthorization
);

handleCallback();
</script>
</body>
</html>
